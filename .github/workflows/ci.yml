name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    env:
      NX_DAEMON: 'false'
      GUKSU_RUNNER_MODULES: ${{ github.workspace }}/test/fixtures/native-runners/node_modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixtures/native-runners/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked native runners
        run: npm ci --prefix test/fixtures/native-runners --no-audit --no-fund
      - name: Validate harness structure
        run: npm run check
      - name: Run regressions including real Nx and Turbo
        run: npm test
      - name: Install package and smoke-test CLI
        run: npm run test:package

  ci:
    name: CI
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
